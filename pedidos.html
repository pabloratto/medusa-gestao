<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pedidos — Medusa Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .kanban { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 16px; padding: 20px 24px; }
  .coluna { background: #161616; border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; transition: border-color .15s, background .15s; }
  .coluna.alvo { border-color: var(--accent-line); background: rgba(170,220,0,.04); }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
  .col-head .bolinha { width: 8px; height: 8px; border-radius: 50%; }
  .col-head .nome { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-muted); flex: 1; }
  .col-head .qtd { font-size: 11px; font-weight: 700; color: var(--fg-dim); background: var(--surface-alt); border-radius: 99px; padding: 2px 8px; }
  .col-total { padding: 0 16px 10px; font-size: 11px; color: var(--fg-dim); }
  .cards { flex: 1; overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
  .pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 12px 13px; cursor: pointer; transition: border-color .15s, transform .1s; }
  .pcard:hover { border-color: var(--border-strong); }
  .pcard.arrastando { opacity: .4; }
  .pcard .top { display: flex; justify-content: space-between; gap: 8px; }
  .pcard .cli { font-weight: 600; font-size: 13px; }
  .pcard .num { font-size: 11px; color: var(--fg-dim); font-weight: 600; }
  .pcard .desc { font-size: 12px; color: var(--fg-muted); margin: 4px 0 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pcard .bot { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pcard .val { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 14px; }
  .pcard .ent { font-size: 11px; color: var(--fg-dim); }
  .pcard .ent.alerta { color: #FFA726; font-weight: 700; }
  .pcard .ent.atraso { color: var(--danger); font-weight: 700; }
  .prio { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; color: var(--fg-dim); }
  .prio i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .barra { height: 4px; background: #262626; border-radius: 99px; margin: 0 0 10px; overflow: hidden; }
  .barra div { height: 100%; background: #29B6F6; border-radius: 99px; }
  .barra-lab { display: flex; justify-content: space-between; font-size: 10px; color: var(--fg-dim); margin-bottom: 4px; }
  .pronto-msg { font-size: 11px; color: var(--success); font-weight: 600; margin-bottom: 8px; }
  .col-vazia { font-size: 12px; color: #444; text-align: center; padding: 20px 8px; border: 1.5px dashed #262626; border-radius: 10px; }
  .filtros { display: flex; gap: 6px; }
  /* Janela do pedido */
  .pform { display: flex; flex-direction: column; gap: 14px; }
  .prog-linha { display: flex; align-items: center; gap: 12px; }
  .prog-linha input[type=range] { flex: 1; accent-color: #29B6F6; }
  .prog-linha span { width: 40px; text-align: right; font-weight: 700; }
  .pago-linha { display: flex; align-items: center; justify-content: space-between; background: var(--field); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--fg-muted); }
  .pform .rodape { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 14px; }
  .pform .rodape .links { display: flex; gap: 14px; flex-wrap: wrap; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/core.js"></script>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div style="flex:1;">
        <div class="page-title">Pedidos</div>
        <div class="page-sub" id="subtitulo">Produção e entregas</div>
      </div>
      <div class="filtros" id="filtros">
        <button type="button" class="chip on" data-f="todos">Todos</button>
        <button type="button" class="chip" data-f="urgentes">Urgentes</button>
        <button type="button" class="chip" data-f="atrasados">Atrasados</button>
        <button type="button" class="chip" data-f="hoje">Hoje</button>
      </div>
      <div class="input-icon busca-top" style="width:200px;">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="input" id="busca" type="search" placeholder="Buscar pedido…">
      </div>
      <button class="btn sm" id="btnNovo"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Novo pedido</button>
    </div>
    <div class="kanban" id="kanban"></div>
  </main>
</div>
<datalist id="listaClientes"></datalist>
<script src="assets/pedidos.js"></script>
</body>
</html>
