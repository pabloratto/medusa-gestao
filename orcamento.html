<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Orçamento — Medusa Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .split { grid-template-columns: 1fr 380px; }
  .doc { max-width: 820px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 26px 28px; display: flex; flex-direction: column; gap: 18px; }
  .doc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .doc-emp { display: flex; gap: 14px; align-items: center; }
  .doc-emp .logo { width: 48px; height: 48px; font-size: 22px; border-radius: 10px; }
  .doc-emp-nome { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; }
  .doc-emp-info { font-size: 11px; color: var(--fg-dim); line-height: 1.5; }
  .doc-num { text-align: right; }
  .doc-num .label { color: var(--accent); }
  .doc-num .n { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 800; margin: 2px 0 6px; }
  .doc-num .n.rasc { font-size: 13px; color: var(--fg-dim); font-weight: 600; }
  .doc-num .input { padding: 6px 10px; font-size: 12px; width: 150px; }
  .status-bar { display: flex; align-items: center; gap: 8px; }
  .status-bar .label { margin-right: 4px; }
  .st-op { border: 1.5px solid var(--border); background: var(--field); border-radius: 8px; padding: 6px 12px; font-size: 11px; font-weight: 700; color: var(--fg-dim); }
  .st-op.on[data-s="aguardando"] { border-color: rgba(255,167,38,.5); color: #FFA726; background: rgba(255,167,38,.1); }
  .st-op.on[data-s="aprovado"] { border-color: rgba(102,187,106,.5); color: var(--success); background: var(--success-dim); }
  .st-op.on[data-s="recusado"] { border-color: rgba(255,107,107,.5); color: var(--danger); background: var(--danger-dim); }
  .itens-cab, .item { display: grid; grid-template-columns: 1fr 70px 120px 110px 32px; gap: 8px; align-items: center; }
  .itens-cab div { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); }
  .item .input { padding: 9px 11px; }
  .item .tot { text-align: right; font-weight: 700; font-size: 13px; }
  .item .icon-btn:hover { color: var(--danger); }
  .itens { display: flex; flex-direction: column; gap: 8px; }
  .add-item { align-self: flex-start; background: none; border: 1.5px dashed var(--border-strong); color: var(--fg-muted); border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 600; }
  .add-item:hover { color: var(--accent); border-color: var(--accent-line); }
  .rodape-doc { display: grid; grid-template-columns: 1fr 280px; gap: 24px; align-items: start; }
  .totais { background: var(--field); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .totais .l { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--fg-muted); }
  .totais .l .input { width: 120px; padding: 6px 10px; text-align: right; }
  .totais .total { border-top: 1px solid var(--border); padding-top: 10px; color: var(--fg); }
  .totais .total b { font-family: 'Sora', sans-serif; font-size: 22px; color: var(--accent); }
  .doc-acoes { display: flex; gap: 10px; align-items: center; }
  .doc-acoes .btn.principal { flex: 1; }
  .doc-extra { display: flex; justify-content: space-between; align-items: center; }
  .hint-cli { font-size: 11px; color: var(--fg-dim); }
  .hint-cli.novo { color: #29B6F6; }
  .orc-card { margin: 0 16px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: border-color .15s; }
  .orc-card:hover { border-color: var(--border-strong); }
  .orc-card.sel { border-color: rgba(41,182,246,.5); background: rgba(41,182,246,.05); }
  .orc-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .orc-card .cli { font-weight: 600; font-size: 13px; }
  .orc-card .meta { font-size: 11px; color: var(--fg-dim); margin-top: 2px; }
  .orc-card .bot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; gap: 8px; }
  .orc-card .desc { font-size: 11px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .orc-card .val { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px; white-space: nowrap; }
  .lista-head { flex-wrap: wrap; }
  .lista { padding-top: 12px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/core.js"></script>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div style="flex:1;">
        <div class="page-title">Orçamento</div>
        <div class="page-sub">Criar e gerenciar propostas comerciais</div>
      </div>
      <button class="btn sm" id="btnNovo"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Novo orçamento</button>
    </div>

    <div class="split">
      <section class="painel">
        <form class="doc" id="form" novalidate autocomplete="off">
          <div class="doc-head">
            <div class="doc-emp" id="docEmpresa"></div>
            <div class="doc-num">
              <div class="label">Proposta comercial</div>
              <div class="n rasc" id="docNumero">Novo · número ao salvar</div>
              <label class="label" for="fData" style="display:block;margin-bottom:4px;color:var(--fg-dim)">Emitido em</label>
              <input class="input" id="fData" type="date">
            </div>
          </div>

          <div class="status-bar" id="statusBar" hidden>
            <span class="label">Status</span>
            <button type="button" class="st-op" data-s="aguardando">Aguardando</button>
            <button type="button" class="st-op" data-s="aprovado">Aprovado</button>
            <button type="button" class="st-op" data-s="recusado">Recusado</button>
          </div>

          <div class="secao">Dados do cliente</div>
          <div class="g2">
            <div class="field"><label class="label" for="fCliente">Nome / Empresa *</label>
              <input class="input" id="fCliente" list="listaClientes" maxlength="120" placeholder="Nome do cliente ou empresa…">
              <datalist id="listaClientes"></datalist>
              <div class="hint-cli" id="hintCli"></div></div>
            <div class="field"><label class="label" for="fWhats">WhatsApp</label>
              <input class="input" id="fWhats" data-mask="tel" inputmode="tel" placeholder="(00) 00000-0000"></div>
          </div>
          <div class="g2">
            <div class="field"><label class="label" for="fEmail">E-mail</label>
              <input class="input" id="fEmail" type="email" placeholder="email@cliente.com"></div>
            <div class="field"><label class="label" for="fValidade">Validade do orçamento</label>
              <input class="input" id="fValidade" type="date"></div>
          </div>

          <div class="secao">Itens / serviços</div>
          <div class="itens-cab"><div>Descrição</div><div>Qtd.</div><div>Valor unit.</div><div style="text-align:right">Total</div><div></div></div>
          <div class="itens" id="itens"></div>
          <datalist id="listaCatalogo"></datalist>
          <button type="button" class="add-item" id="btnAddItem">+ Adicionar item</button>

          <div class="rodape-doc">
            <div class="stack">
              <div class="field"><div class="label">Forma de pagamento</div><div class="opcoes" id="formas"></div></div>
              <div class="field"><label class="label" for="fObs">Observações</label>
                <textarea class="input" id="fObs" rows="4" maxlength="1500" placeholder="Condições especiais, prazo de entrega, garantias…"></textarea></div>
            </div>
            <div class="totais">
              <div class="l"><span>Subtotal</span><span id="tSub">R$ 0,00</span></div>
              <div class="l"><span>Desconto (R$)</span><input class="input" id="fDesconto" inputmode="decimal" placeholder="0,00"></div>
              <div class="l total"><span>Total</span><b id="tTotal">R$ 0,00</b></div>
            </div>
          </div>

          <div class="msg" id="fMsg"></div>
          <div class="doc-acoes">
            <button class="btn principal" id="btnSalvar" type="submit">Salvar orçamento</button>
            <button type="button" class="btn sm sec" id="btnPDF" style="padding:13px 16px;">PDF</button>
            <button type="button" class="btn sm sec" id="btnWhats" style="padding:13px 16px;">WhatsApp</button>
          </div>
          <div class="doc-extra" id="acoesEdicao" hidden>
            <div style="display:flex;gap:16px;">
              <button type="button" class="link-btn" id="btnPedido">Gerar pedido</button>
              <button type="button" class="link-btn" id="btnDuplicar">Duplicar</button>
            </div>
            <button type="button" class="link-btn danger" id="btnExcluir">Excluir orçamento</button>
          </div>
        </form>
      </section>

      <section class="painel sem-pad">
        <div class="lista-head">
          <div class="cont" id="contagem">Salvos</div>
          <div class="input-icon" style="width:100%;">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input class="input" id="busca" type="search" placeholder="Buscar por cliente, número ou item…" style="padding:8px 12px 8px 36px;font-size:12px;border-width:1px;">
          </div>
          <div style="display:flex;gap:6px;" id="filtros">
            <button type="button" class="chip on" data-f="todos">Todos</button>
            <button type="button" class="chip" data-f="aguardando">Aguardando</button>
            <button type="button" class="chip" data-f="aprovado">Aprovados</button>
            <button type="button" class="chip" data-f="recusado">Recusados</button>
          </div>
        </div>
        <div class="lista" id="lista"></div>
      </section>
    </div>
  </main>
</div>
<script src="assets/orcamento.js"></script>
</body>
</html>
