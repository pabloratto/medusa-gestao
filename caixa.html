<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Caixa — Medusa Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .saldo-box { background: var(--success-dim); border: 1px solid rgba(102,187,106,.2); border-radius: 10px; padding: 7px 18px; text-align: right; }
  .saldo-box.neg { background: var(--danger-dim); border-color: rgba(255,107,107,.2); }
  .saldo-box .label { color: var(--success); }
  .saldo-box .val { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 800; color: var(--success); }
  .saldo-box.neg .label, .saldo-box.neg .val { color: var(--danger); }

  .cols { flex: 1; overflow: hidden; display: grid; grid-template-columns: 380px 1fr; }
  .col-form { border-right: 1px solid var(--line); overflow-y: auto; padding: 24px; }
  .col-hist { overflow: hidden; display: flex; flex-direction: column; }

  .tabs { display: flex; gap: 4px; background: var(--field); padding: 4px; border-radius: 10px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; background: transparent; color: var(--fg-muted); transition: background .15s, color .15s; }
  .tab:hover { color: var(--fg); }
  .tab.on[data-tipo="entrada"] { background: var(--accent); color: #0A0A0A; }
  .tab.on[data-tipo="saida"] { background: var(--danger); color: #1A0000; }

  .editando { display: flex; align-items: center; justify-content: space-between; background: rgba(41,182,246,.08); border: 1px solid rgba(41,182,246,.25); color: #29B6F6; border-radius: 10px; padding: 9px 12px; margin-bottom: 16px; font-size: 12px; font-weight: 600; }
  .form { display: flex; flex-direction: column; gap: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .formas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .forma { background: var(--field); border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 6px; font-size: 11px; font-weight: 600; color: var(--fg-dim); }
  .forma:hover { color: var(--fg); }
  .forma.on { background: var(--accent-dim); border-color: rgba(170,220,0,.4); color: var(--accent); font-weight: 700; }
  .form-actions { display: flex; flex-direction: column; gap: 10px; }
  .form-actions .linha { display: flex; justify-content: space-between; }
  #btnSalvar.saida { background: var(--danger); color: #1A0000; }

  .hist-head { padding: 16px 24px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .hist-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-dim); }
  .mes-nav { display: flex; align-items: center; gap: 2px; flex: 1; }
  .mes-nav .icon-btn svg { width: 14px; height: 14px; }
  .mes-label { font-size: 13px; font-weight: 600; min-width: 128px; text-align: center; }
  .mes-hoje { font-size: 11px; margin-left: 4px; }
  .filtros { display: flex; gap: 6px; }
  .busca { width: 190px; }
  .busca .input { padding: 7px 12px 7px 32px; font-size: 12px; border-width: 1px; }
  .busca svg { left: 11px; width: 12px; height: 12px; }

  .resumo { padding: 12px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; }
  .res { flex: 1; border-radius: 8px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); }
  .res .label { font-size: 9px; margin-bottom: 4px; }
  .res .val { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 800; }
  .res.in { background: var(--success-dim); border-color: rgba(102,187,106,.15); }
  .res.in .label, .res.in .val { color: var(--success); }
  .res.out { background: var(--danger-dim); border-color: rgba(255,107,107,.15); }
  .res.out .label, .res.out .val { color: var(--danger); }

  .lista { flex: 1; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .row:hover { background: #1E1E1E; }
  .row.sel { background: rgba(41,182,246,.07); }
  .row.cab { cursor: default; padding: 10px 16px; border-bottom-color: #1E1E1E; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .row.cab:hover { background: var(--bg); }
  .row.cab div { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .c-desc { flex: 1; min-width: 0; }
  .c-desc .t { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-desc .s { font-size: 11px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-data { width: 80px; font-size: 12px; color: var(--fg-dim); text-align: right; }
  .c-tipo { width: 60px; text-align: center; }
  .c-val { width: 120px; font-size: 13px; font-weight: 700; text-align: right; }
  .c-mais { width: 30px; display: flex; justify-content: center; color: #555; }
  .c-mais svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
  .vazio { padding: 60px 24px; text-align: center; color: var(--fg-dim); line-height: 1.6; }
  .vazio strong { display: block; color: var(--fg-muted); font-size: 14px; margin-bottom: 4px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/core.js"></script>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div style="flex:1;">
        <div class="page-title">Caixa</div>
        <div class="page-sub">Controle de entradas e saídas</div>
      </div>
      <div class="saldo-box" id="saldoBox" title="Saldo inicial + todas as entradas − todas as saídas">
        <div class="label">Saldo atual</div>
        <div class="val" id="saldoAtual">—</div>
      </div>
    </div>

    <div class="cols">
      <!-- Coluna esquerda: formulário -->
      <section class="col-form">
        <div class="tabs" role="tablist">
          <button type="button" class="tab on" data-tipo="entrada">Entrada</button>
          <button type="button" class="tab" data-tipo="saida">Saída</button>
        </div>

        <div class="editando" id="editando" hidden>
          <span id="editandoTxt">Editando lançamento</span>
          <button type="button" class="link-btn" id="cancelarEdicao">Cancelar</button>
        </div>

        <form class="form" id="form" novalidate>
          <div class="field">
            <label class="label" for="fDesc">Descrição</label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
              <input class="input" id="fDesc" maxlength="120" autocomplete="off" placeholder="Ex: Pagamento cliente Agência Blur">
            </div>
          </div>
          <div class="grid2">
            <div class="field">
              <label class="label" for="fValor">Valor (R$)</label>
              <input class="input" id="fValor" inputmode="decimal" autocomplete="off" placeholder="0,00">
            </div>
            <div class="field">
              <label class="label" for="fData">Data</label>
              <input class="input" id="fData" type="date">
            </div>
          </div>
          <div class="field">
            <label class="label" for="fCat">Categoria</label>
            <select class="input" id="fCat"></select>
          </div>
          <div class="field">
            <div class="label">Forma de pagamento</div>
            <div class="formas" id="formas">
              <button type="button" class="forma on" data-forma="PIX">PIX</button>
              <button type="button" class="forma" data-forma="Dinheiro">Dinheiro</button>
              <button type="button" class="forma" data-forma="Cartão">Cartão</button>
            </div>
          </div>
          <div class="field">
            <label class="label" for="fObs">Observação (opcional)</label>
            <textarea class="input" id="fObs" maxlength="500" placeholder="Notas adicionais…"></textarea>
          </div>
          <div class="msg" id="fMsg"></div>
          <div class="form-actions">
            <button class="btn block" id="btnSalvar" type="submit">+ Registrar entrada</button>
            <div class="linha" id="acoesEdicao" hidden>
              <button type="button" class="link-btn danger" id="btnExcluir">Excluir lançamento</button>
            </div>
          </div>
        </form>
      </section>

      <!-- Coluna direita: histórico -->
      <section class="col-hist">
        <div class="hist-head">
          <div class="hist-title">Histórico</div>
          <div class="mes-nav">
            <button type="button" class="icon-btn" id="mesAnt" title="Mês anterior"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
            <div class="mes-label" id="mesLabel"></div>
            <button type="button" class="icon-btn" id="mesProx" title="Próximo mês"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
            <button type="button" class="link-btn mes-hoje" id="mesHoje" hidden>Voltar para este mês</button>
          </div>
          <div class="filtros" id="filtros">
            <button type="button" class="chip on" data-f="todos">Todos</button>
            <button type="button" class="chip" data-f="entrada">Entradas</button>
            <button type="button" class="chip" data-f="saida">Saídas</button>
          </div>
          <div class="input-icon busca">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input class="input" id="busca" type="search" placeholder="Buscar no mês…">
          </div>
        </div>

        <div class="resumo">
          <div class="res in"><div class="label" id="rEntLabel">Entradas</div><div class="val" id="rEnt">—</div></div>
          <div class="res out"><div class="label" id="rSaiLabel">Saídas</div><div class="val" id="rSai">—</div></div>
          <div class="res"><div class="label" id="rSalLabel">Saldo</div><div class="val" id="rSal">—</div></div>
        </div>

        <div class="lista" id="lista"><div class="loading">Carregando…</div></div>
      </section>
    </div>
  </main>
</div>

<script src="assets/caixa.js"></script>
</body>
</html>
