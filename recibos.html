<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Recibos — Medusa Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .split { grid-template-columns: 380px 1fr; }
  .mes-grupo { padding: 14px 20px 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-dim); display: flex; justify-content: space-between; }
  .rrow { margin: 0 12px 6px; padding: 12px 14px; border: 1px solid transparent; border-radius: 10px; cursor: pointer; }
  .rrow:hover { background: #1A1A1A; }
  .rrow.sel { background: rgba(170,220,0,.06); border-color: rgba(170,220,0,.25); }
  .rrow .l1, .rrow .l2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rrow .cli { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rrow .v { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .rrow .l2 { margin-top: 4px; font-size: 11px; color: var(--fg-dim); }
  .rrow .ref { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra-acoes { display: flex; align-items: center; gap: 8px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .barra-acoes .info { flex: 1; font-size: 12px; color: var(--fg-muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview { flex: 1; overflow-y: auto; padding: 28px; background: #0D0D0D; }
  .preview .pdoc { max-width: 720px; margin: 0 auto; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .carimbo { max-width: 720px; margin: 0 auto 12px; text-align: center; font-size: 12px; font-weight: 700; color: #FFA726; background: rgba(255,167,38,.08); border: 1px solid rgba(255,167,38,.25); border-radius: 8px; padding: 8px; }
  .rform { max-width: 720px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  .itens-cab, .item { display: grid; grid-template-columns: 1fr 70px 120px 110px 32px; gap: 8px; align-items: center; }
  .itens-cab div { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); }
  .item .input { padding: 9px 11px; }
  .item .tot { text-align: right; font-weight: 700; }
  .item .icon-btn:hover { color: var(--danger); }
  .itens { display: flex; flex-direction: column; gap: 8px; }
  .add-item { align-self: flex-start; background: none; border: 1.5px dashed var(--border-strong); color: var(--fg-muted); border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 600; }
  .add-item:hover { color: var(--accent); border-color: var(--accent-line); }
  .total-linha { display: flex; justify-content: flex-end; align-items: baseline; gap: 12px; font-size: 13px; color: var(--fg-muted); }
  .total-linha b { font-family: 'Sora', sans-serif; font-size: 22px; color: var(--accent); }
  .st-ops { display: flex; gap: 8px; }
  .st-op { border: 1.5px solid var(--border); background: var(--field); border-radius: 8px; padding: 9px 14px; font-size: 12px; font-weight: 700; color: var(--fg-dim); flex: 1; }
  .st-op.on[data-s="pago"] { border-color: rgba(102,187,106,.5); color: var(--success); background: var(--success-dim); }
  .st-op.on[data-s="pendente"] { border-color: rgba(255,167,38,.5); color: #FFA726; background: rgba(255,167,38,.1); }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/core.js"></script>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div style="flex:1;">
        <div class="page-title">Recibos</div>
        <div class="page-sub" id="subtitulo">Emitir e exportar</div>
      </div>
      <div class="input-icon busca-top" style="width:220px;">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="input" id="busca" type="search" placeholder="Buscar…">
      </div>
      <button class="btn sm" id="btnNovo"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Novo recibo</button>
    </div>

    <div class="split">
      <section class="painel sem-pad">
        <div class="lista-head" style="padding:10px 16px;">
          <div style="display:flex;gap:6px;" id="filtros">
            <button type="button" class="chip on" data-f="todos">Todos</button>
            <button type="button" class="chip" data-f="pago">Pagos</button>
            <button type="button" class="chip" data-f="pendente">A receber</button>
          </div>
        </div>
        <div class="lista" id="lista"></div>
      </section>
      <section class="painel sem-pad" id="direita"></section>
    </div>
  </main>
</div>
<datalist id="listaClientes"></datalist>
<datalist id="listaCatalogo"></datalist>
<script src="assets/recibos.js"></script>
</body>
</html>
