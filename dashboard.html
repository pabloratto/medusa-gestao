<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Dashboard — Medusa Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .topbar { height: 76px; }
  .ola { font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 700; }
  .busca-g { position: relative; width: 320px; }
  .busca-g .input { padding: 9px 12px 9px 36px; border-width: 1px; }
  .resultados { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #1E1E1E; border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); max-height: 420px; overflow-y: auto; z-index: 30; padding: 6px; }
  .res-grupo { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-dim); padding: 8px 10px 4px; }
  .res-item { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); font-size: 12px; }
  .res-item:hover, .res-item.foco { background: var(--surface-alt); }
  .res-item span:last-child { color: var(--fg-dim); white-space: nowrap; }
  .sino-wrap { position: relative; }
  .sino { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: #181818; color: var(--fg-muted); display: flex; align-items: center; justify-content: center; position: relative; }
  .sino:hover { color: var(--fg); }
  .sino svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }
  .sino .bolha { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .pop-alertas { position: absolute; top: calc(100% + 8px); right: 0; width: 340px; background: #1E1E1E; border: 1px solid var(--border-strong); border-radius: 12px; padding: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); z-index: 30; }
  .corpo { flex: 1; overflow-y: auto; padding: 22px 32px 32px; display: flex; flex-direction: column; gap: 18px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
  .stat:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .stat .label { font-size: 10px; }
  .stat .v { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 800; }
  .stat .s { font-size: 11px; color: var(--fg-muted); }
  .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .sec-tit { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-dim); margin-bottom: 12px; }
  .atalhos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .atalho { border-radius: var(--radius); padding: 18px 20px; display: flex; align-items: center; gap: 16px; text-decoration: none; transition: transform .15s, filter .15s; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .atalho:hover { transform: translateY(-2px); filter: brightness(1.12); }
  .atalho .ic { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .atalho .ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
  .atalho .n { font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700; color: #fff; }
  .atalho .d { font-size: 11px; color: rgba(255,255,255,.45); }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .ativ { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; }
  .ativ:last-child { border-bottom: none; }
  .ativ:hover .at { color: var(--accent); }
  .ativ .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ativ .av { font-size: 13px; font-weight: 700; width: 92px; flex-shrink: 0; }
  .ativ .at { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ativ .as { font-size: 11px; color: var(--fg-dim); }
  .entrega { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; }
  .entrega:last-child { border-bottom: none; }
  .entrega .dia { width: 44px; text-align: center; flex-shrink: 0; border-radius: 8px; background: var(--surface-alt); padding: 5px 0; }
  .entrega .dia b { display: block; font-family: 'Sora', sans-serif; font-size: 15px; }
  .entrega .dia span { font-size: 9px; color: var(--fg-dim); text-transform: uppercase; font-weight: 700; }
  .entrega .et { font-size: 13px; font-weight: 600; }
  .entrega .es { font-size: 11px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/painel.js"></script>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div style="flex:1;">
        <div class="ola" id="ola">Olá 👋</div>
        <div class="page-sub" id="hojeTxt"></div>
      </div>
      <div class="busca-g input-icon">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="input" id="busca" type="search" placeholder="Buscar cliente, orçamento, pedido, recibo…" autocomplete="off">
        <div class="resultados" id="resultados" hidden></div>
      </div>
      <div class="sino-wrap">
        <button class="sino" id="sino" title="Alertas"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="bolha" id="bolha" hidden>0</span></button>
        <div class="pop-alertas" id="popAlertas" hidden></div>
      </div>
    </div>
    <div class="corpo" id="corpo"><div class="loading" style="padding:60px">Carregando…</div></div>
  </main>
</div>
<script src="assets/dashboard.js"></script>
</body>
</html>
