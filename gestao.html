<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Gestão — Medusa Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .corpo { flex: 1; overflow-y: auto; padding: 22px 28px 32px; display: flex; flex-direction: column; gap: 16px; }
  .periodo { display: flex; align-items: center; gap: 6px; }
  .periodo .input { padding: 6px 10px; font-size: 12px; width: 150px; border-width: 1px; }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .kpi { background: #181818; border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; text-decoration: none; color: inherit; transition: border-color .15s; }
  .kpi:hover { border-color: var(--border-strong); }
  .kpi .label { font-size: 10px; }
  .kpi .v { font-family: 'Sora', sans-serif; font-size: 21px; font-weight: 800; margin: 6px 0 4px; white-space: nowrap; }
  .kpi .d { font-size: 11px; color: var(--fg-dim); }
  .kpi .up { color: var(--success); font-weight: 700; }
  .kpi .down { color: var(--danger); font-weight: 700; }
  .linha2 { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
  .linha3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grafico { display: flex; align-items: flex-end; gap: 18px; height: 200px; padding: 0 6px; border-bottom: 1px solid var(--border); }
  .sem { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .sem .barras { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 5px; }
  .sem .b { width: 34%; max-width: 30px; border-radius: 6px 6px 0 0; min-height: 2px; position: relative; transition: height .3s; }
  .sem .b.r { background: var(--accent); }
  .sem .b.d { background: rgba(255,107,107,.6); }
  .sem .b:hover::after { content: attr(data-v); position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -4px); background: #000; border: 1px solid var(--border); padding: 3px 7px; border-radius: 6px; font-size: 10px; white-space: nowrap; z-index: 2; }
  .sem .vlab { font-size: 10px; color: var(--fg-muted); font-weight: 600; }
  .sem-nomes { display: flex; gap: 18px; padding: 8px 6px 0; }
  .sem-nomes div { flex: 1; text-align: center; font-size: 11px; color: var(--fg-dim); }
  .sem-nomes div.atual { color: var(--accent); font-weight: 700; }
  .legenda { display: flex; gap: 14px; font-size: 11px; color: var(--fg-dim); font-weight: 500; }
  .legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .rodape-g { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-dim); margin-top: 12px; }
  .meta-anel { display: flex; justify-content: center; margin: 4px 0 14px; position: relative; }
  .meta-anel .centro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .meta-anel .pct { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 800; }
  .meta-anel .pl { font-size: 10px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .meta-linhas > div { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--fg-muted); }
  .meta-linhas > div:last-child { border-bottom: none; }
  .meta-linhas b { color: var(--fg); }
  .rank { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .rank .pos { width: 24px; height: 24px; border-radius: 7px; background: var(--surface-alt); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--fg-muted); flex-shrink: 0; }
  .rank:first-child .pos { background: var(--accent-dim); color: var(--accent); }
  .rank .rn { flex: 1; min-width: 0; }
  .rank .rt { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank .rb { height: 3px; background: #262626; border-radius: 99px; margin-top: 5px; }
  .rank .rb div { height: 100%; background: var(--success); border-radius: 99px; opacity: .7; }
  .rank .rv { text-align: right; }
  .rank .rv b { font-size: 12px; display: block; }
  .rank .rv span { font-size: 10px; color: var(--fg-dim); }
  .ver-todas { margin-top: auto; padding-top: 10px; border-top: 1px solid #222; text-align: center; font-size: 11px; color: var(--fg-dim); text-decoration: none; }
  .ver-todas:hover { color: var(--fg); }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/painel.js"></script>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div style="flex:1;">
        <div class="page-title">Gestão Financeira</div>
        <div class="page-sub" id="subtitulo">Visão geral</div>
      </div>
      <div class="periodo" id="periodo"></div>
    </div>
    <div class="corpo" id="corpo"><div class="loading" style="padding:60px">Carregando…</div></div>
  </main>
</div>
<script src="assets/gestao.js"></script>
</body>
</html>
